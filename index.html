<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Catch Your Girl - Ultra Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Hind+Siliguri:wght@600;700;800&display=swap');
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: #030712;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Hind Siliguri', sans-serif;
      touch-action: manipulation;
    }

    /* গেম এরিয়া স্ক্রিনের পুরো জায়গা জুড়ে থাকবে */
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.98);
      padding: 12px;
      border-radius: 24px;
      border: 3px solid rgba(56, 189, 248, 0.4);
      width: 100vw;
      height: 100vh;
      max-width: 1000px;
      max-height: 600px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(56, 189, 248, 0.15);
    }

    canvas {
      border: 3px solid #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
      background: #050811;
      width: 100%;
      flex-grow: 1;
      border-radius: 18px;
      touch-action: none;
    }

    /* টপ বার কাস্টমাইজেশন (বটম লেআউট আরও স্পষ্ট করার জন্য) */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 6px;
    }

    .diff-selector { display: flex; gap: 8px; }

    .diff-btn {
      padding: 8px 16px;
      border: 2px solid rgba(56, 189, 248, 0.4);
      background: #0f172a;
      color: #9ca3af;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .diff-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #030712;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
      border-color: #7dd3fc;
    }

    .audio-btn {
      background: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ফোনের জন্য বড় ও চমৎকার টাচ কন্ট্রোল বাটন */
    .controls {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      flex: 1;
      height: 70px; /* বাটনের উচ্চতা বাড়ানো হয়েছে */
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border: none;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      touch-action: manipulation;
      box-shadow: 0 6px 0 #075985, 0 10px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.05s, box-shadow 0.05s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-jump {
      flex: 1.4;
      background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%);
      box-shadow: 0 6px 0 #9f1239, 0 10px 20px rgba(244, 63, 94, 0.4);
      font-size: 22px;
    }

    .btn:active { 
      transform: translateY(4px); 
      box-shadow: 0 2px 0 transparent, 0 4px 10px rgba(0,0,0,0.3); 
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <div class="diff-selector">
      <button class="diff-btn active" onclick="setDifficulty('easy', event)">EASY</button>
      <button class="diff-btn" onclick="setDifficulty('medium', event)">MEDIUM</button>
      <button class="diff-btn" onclick="setDifficulty('hard', event)">HARD</button>
    </div>
    <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🔊 Sound: ON</button>
  </div>

  <canvas id="gameCanvas" width="900" height="420"></canvas>

  <div class="controls">
    <button class="btn" id="btnLeft">◀ PUSH BACK</button>
    <button class="btn btn-jump" id="btnJump">🦘 JUMP</button>
    <button class="btn" id="btnRight">FORWARD ▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const imgBou = new Image(); imgBou.src = 'bou.jpg'; 
const imgBor = new Image(); imgBor.src = 'bor.jpg'; 
const imgGameOver = new Image(); imgGameOver.src = 'gameover.jpg'; 
const imgWin = new Image(); imgWin.src = 'win.jpg'; 

const imgCactus = new Image(); imgCactus.src = 'https://cdn-icons-png.flaticon.com/512/3532/3532731.png';
const imgRock = new Image(); imgRock.src = 'https://cdn-icons-png.flaticon.com/512/2909/2909772.png';

const soundWin = new Audio('win.mp3');
const soundLose = new Audio('lose.mp3');
let isMuted = false;

function toggleAudio() {
  isMuted = !isMuted;
  document.getElementById('audioToggle').innerText = isMuted ? "🔇 Sound: OFF" : "🔊 Sound: ON";
}

function playSound(sound) {
  if (!isMuted) {
    sound.currentTime = 0;
    sound.play().catch(() => {});
  }
}

let groundY = 340;
let isGameOver = false, isGameWon = false;
let score = 0, highScore = 0;
let baseSpeed = 5, gameSpeed = 5;
let currentDifficulty = 'easy';

// ব্যাকগ্রাউন্ডের তারা ও নিওন বিল্ডিং
let stars = Array.from({length: 50}, () => ({x: Math.random()*900, y: Math.random()*190, speed: Math.random()*0.5 + 0.1, size: Math.random()*2.5 + 1}));
let cityBuildings = Array.from({length: 12}, (_, i) => ({
  x: i * 85, 
  width: 70, 
  height: 60 + Math.random()*100,
  color: `rgba(${Math.floor(Math.random()*30 + 15)}, ${Math.floor(Math.random()*40 + 20)}, ${Math.floor(Math.random()*70 + 40)}, 0.85)`
}));

// বর ও বউ সাইজ বড় করা হয়েছে (Large Characters)
let bor = { 
  x: 80, y: groundY - 80, width: 65, height: 80, 
  speed: 8.5, vy: 0, gravity: 0.65, 
  jumpCount: 0, maxJumps: 2, isDead: false 
};

let bou = { 
  x: 650, y: groundY - 80, width: 65, height: 80, 
  baseX: 650,
  speed: 1.5, vy: 0, gravity: 0.65, isJumping: false 
};

const obstacleTypes = [
  { type: 'cactus', width: 50, height: 65, img: imgCactus, color: '#22c55e' },
  { type: 'rock', width: 55, height: 45, img: imgRock, color: '#64748b' },
  { type: 'pit', width: 60, height: 20, img: null, color: '#0f172a' }
];

let obstacle = { x: 900, y: groundY - 65, width: 50, height: 65, typeData: obstacleTypes[0] };
let moveLeft = false, moveRight = false;

function setDifficulty(level, e) {
  currentDifficulty = level;
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
  if(e && e.target) e.target.classList.add('active');

  if (level === 'easy') {
    baseSpeed = 5;
    bou.baseX = 580;
  } else if (level === 'medium') {
    baseSpeed = 7;
    bou.baseX = 670;
  } else if (level === 'hard') {
    baseSpeed = 9;
    bou.baseX = 760;
  }
  restartGame();
}

function makeBorJump() {
  if (bor.jumpCount < bor.maxJumps && !bor.isDead && !isGameWon) {
    bor.vy = -13.5;
    bor.jumpCount++;
  }
}

// টাচপ্রুফ মোবাইল ইভেন্ট
const bindTouch = (elem, startFn, endFn) => {
  elem.addEventListener("touchstart", (e) => { e.preventDefault(); startFn(); }, { passive: false });
  elem.addEventListener("touchend", (e) => { e.preventDefault(); if(endFn) endFn(); }, { passive: false });
  elem.addEventListener("mousedown", startFn);
  elem.addEventListener("mouseup", endFn);
};

bindTouch(document.getElementById("btnLeft"), () => moveLeft = true, () => moveLeft = false);
bindTouch(document.getElementById("btnRight"), () => moveRight = true, () => moveRight = false);
bindTouch(document.getElementById("btnJump"), () => makeBorJump());

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a") moveLeft = true;
  if (e.key === "ArrowRight" || e.key === "d") moveRight = true;
  if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") {
    if (isGameOver || isGameWon) restartGame();
    else makeBorJump();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a") moveLeft = false;
  if (e.key === "ArrowRight" || e.key === "d") moveRight = false;
});

function update() {
  stars.forEach(s => { s.x -= s.speed; if(s.x < 0) s.x = canvas.width; });
  cityBuildings.forEach(b => { b.x -= gameSpeed * 0.25; if(b.x + b.width < 0) b.x = canvas.width + 10; });

  if (!bor.isDead && !isGameWon) {
    score++;
    if (score > highScore) highScore = score;
    gameSpeed = baseSpeed + Math.floor(score / 350) * 0.5;

    if (moveLeft && bor.x > 0) bor.x -= bor.speed;
    if (moveRight) bor.x += bor.speed;

    let targetBouX = bou.baseX + Math.sin(score * 0.05) * 45; 
    bou.x = Math.min(canvas.width - bou.width - 15, Math.max(300, targetBouX));

    if (bor.x + bor.width >= bou.x + 10) {
      isGameWon = true;
      playSound(soundWin);
    }

    bor.y += bor.vy; bor.vy += bor.gravity;
    if (bor.y >= groundY - bor.height) {
      bor.y = groundY - bor.height;
      bor.jumpCount = 0;
    }

    obstacle.x -= gameSpeed;
    if (obstacle.x + obstacle.width < 0) {
      const randomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
      obstacle.typeData = randomType;
      obstacle.width = randomType.width;
      obstacle.height = randomType.height;
      obstacle.x = canvas.width + Math.random() * 200;
      obstacle.y = (randomType.type === 'pit') ? groundY : groundY - randomType.height;
    }

    if (obstacle.x - (bou.x + bou.width) < 70 && obstacle.x > bou.x && !bou.isJumping) {
      bou.vy = -13; bou.isJumping = true;
    }

    let isHit = false;
    if (obstacle.typeData.type === 'pit') {
      if (bor.x + bor.width > obstacle.x && bor.x < obstacle.x + obstacle.width && bor.y + bor.height >= groundY) isHit = true;
    } else {
      if (bor.x < obstacle.x + obstacle.width - 5 && bor.x + bor.width - 5 > obstacle.x && bor.y < obstacle.y + obstacle.height && bor.y + bor.height > obstacle.y) isHit = true;
    }

    if (isHit) {
      bor.isDead = true;
      isGameOver = true;
      playSound(soundLose);
    }
  } else if (bor.isDead) {
    if (bou.x < canvas.width + 100) bou.x += 6;
  }

  bou.y += bou.vy; bou.vy += bou.gravity;
  if (bou.y >= groundY - bou.height) { bou.y = groundY - bou.height; bou.isJumping = false; }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGradient.addColorStop(0, "#050714");
  bgGradient.addColorStop(0.7, "#0d182e");
  bgGradient.addColorStop(1, "#1e293b");
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => {
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()*0.5 + 0.5})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  cityBuildings.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, groundY - b.height, b.width, b.height);
    ctx.fillStyle = "rgba(253, 224, 71, 0.35)";
    for(let wy = groundY - b.height + 10; wy < groundY - 10; wy += 22) {
      ctx.fillRect(b.x + 10, wy, 10, 12);
      ctx.fillRect(b.x + b.width - 20, wy, 10, 12);
    }
  });

  ctx.shadowBlur = 18; ctx.shadowColor = "#38bdf8";
  ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
  ctx.shadowBlur = 0;

  if (!isGameWon) {
    if (obstacle.typeData.type === 'pit') {
      ctx.fillStyle = "#030712"; ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, 30);
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3; ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, 30);
    } else if (obstacle.typeData.img && obstacle.typeData.img.complete && obstacle.typeData.img.naturalWidth !== 0) {
      ctx.drawImage(obstacle.typeData.img, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    } else {
      ctx.fillStyle = obstacle.typeData.color; ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    }
  }

  if (imgBou.complete && imgBou.naturalWidth !== 0) {
    ctx.drawImage(imgBou, bou.x, bou.y, bou.width, bou.height);
  } else {
    ctx.fillStyle = "#f43f5e"; ctx.fillRect(bou.x, bou.y, bou.width, bou.height);
  }

  if (!bor.isDead) {
    if (imgBor.complete && imgBor.naturalWidth !== 0) {
      ctx.drawImage(imgBor, bor.x, bor.y, bor.width, bor.height);
    } else {
      ctx.fillStyle = "#0284c7"; ctx.fillRect(bor.x, bor.y, bor.width, bor.height);
    }
  }

  // HUD ড্যাশবোর্ড (বড় ও রেসপন্সিভ টেক্সট)
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(15, 12, 280, 80, 12);
  ctx.fill(); ctx.stroke();

  ctx.font = "bold 14px Orbitron"; ctx.fillStyle = "#38bdf8";
  ctx.fillText(`MODE: ${currentDifficulty.toUpperCase()}`, 25, 35);
  let dist = Math.max(0, Math.floor((bou.x - bor.x) / 10));
  ctx.font = "bold 16px 'Hind Siliguri'";
  ctx.fillStyle = "#f43f5e"; ctx.fillText(`বউয়ের দূরত্ব: ${dist}m 🏃‍♀️`, 25, 58);
  ctx.fillStyle = "#fbbf24"; ctx.fillText(`সর্বোচ্চ স্কোর: ${highScore}`, 25, 80);

  // GAME OVER স্ক্রিন
  if (bor.isDead) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.94)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (imgGameOver.complete && imgGameOver.naturalWidth !== 0) ctx.drawImage(imgGameOver, canvas.width/2 - 55, 30, 110, 110);
    ctx.textAlign = "center"; ctx.fillStyle = "#ef4444"; ctx.font = "900 38px Orbitron";
    ctx.fillText("GAME OVER", canvas.width / 2, 175);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText("ধুর! SAYIM আটকে গেল! 💔", canvas.width / 2, 220);
    ctx.fillStyle = "#9ca3af"; ctx.font = "bold 16px 'Hind Siliguri'";
    ctx.fillText("আবার খেলতে স্ক্রিনে টাচ করুন 🔄", canvas.width / 2, 265);
    ctx.textAlign = "left";
  }

  // VICTORY SCREEN
  if (isGameWon) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.94)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (imgWin.complete && imgWin.naturalWidth !== 0) ctx.drawImage(imgWin, canvas.width/2 - 60, 25, 120, 120);
    ctx.textAlign = "center"; ctx.fillStyle = "#4ade80"; ctx.font = "900 40px Orbitron";
    ctx.fillText("VICTORY!! 💍🎉", canvas.width / 2, 175);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText(`অভিনন্দন! আপনি ${currentDifficulty.toUpperCase()} TASFIA কে ধরে ফেলেছেন! ❤️`, canvas.width /
