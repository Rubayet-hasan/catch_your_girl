<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Catch Your Girl - HD Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Hind+Siliguri:wght@600;700;800&display=swap');
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: #020617;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Hind Siliguri', sans-serif;
      touch-action: manipulation;
    }

    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.98);
      padding: 10px;
      border-radius: 20px;
      border: 3px solid rgba(56, 189, 248, 0.4);
      width: 100vw;
      height: 100vh;
      max-width: 1000px;
      max-height: 650px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(56, 189, 248, 0.15);
    }

    canvas {
      border: 3px solid #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
      background: #050811;
      width: 100%;
      height: 100%;
      flex-grow: 1;
      border-radius: 16px;
      touch-action: none;
      cursor: pointer;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .diff-selector { display: flex; gap: 8px; }

    .diff-btn {
      padding: 8px 16px;
      border: 2px solid rgba(56, 189, 248, 0.4);
      background: #0f172a;
      color: #9ca3af;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .diff-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #030712;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
      border-color: #7dd3fc;
    }

    .audio-btn {
      background: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tap-hint {
      position: absolute;
      bottom: 25px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      pointer-events: none;
      animation: pulse 1.5s infinite;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <div class="diff-selector">
      <button class="diff-btn active" onclick="setDifficulty('easy', event)">EASY</button>
      <button class="diff-btn" onclick="setDifficulty('medium', event)">MEDIUM</button>
      <button class="diff-btn" onclick="setDifficulty('hard', event)">HARD</button>
    </div>
    <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🔊 Sound: ON</button>
  </div>

  <canvas id="gameCanvas" width="900" height="420"></canvas>
  <div class="tap-hint">👆 স্ক্রিনের যেকোনো জায়গায় টাচ করে লাফ দিন!</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const imgBou = new Image(); imgBou.src = 'bou.jpg'; 
const imgBor = new Image(); imgBor.src = 'bor.jpg'; 
const imgGameOver = new Image(); imgGameOver.src = 'gameover.jpg'; 
const imgWin = new Image(); imgWin.src = 'win.jpg'; 

const imgCactus = new Image(); imgCactus.src = 'https://cdn-icons-png.flaticon.com/512/3532/3532731.png';
const imgRock = new Image(); imgRock.src = 'https://cdn-icons-png.flaticon.com/512/2909/2909772.png';

const soundWin = new Audio('win.mp3');
const soundLose = new Audio('lose.mp3');
let isMuted = false;

function toggleAudio() {
  isMuted = !isMuted;
  document.getElementById('audioToggle').innerText = isMuted ? "🔇 Sound: OFF" : "🔊 Sound: ON";
}

function playSound(sound) {
  if (!isMuted) {
    sound.currentTime = 0;
    sound.play().catch(() => {});
  }
}

let groundY = 340;
let isGameOver = false, isGameWon = false;
let score = 0, highScore = 0;
let baseSpeed = 5, gameSpeed = 5;
let currentDifficulty = 'easy';

// ব্যাকগ্রাউন্ড
let stars = Array.from({length: 50}, () => ({x: Math.random()*900, y: Math.random()*190, speed: Math.random()*0.5 + 0.1, size: Math.random()*2.5 + 1}));
let cityBuildings = Array.from({length: 12}, (_, i) => ({
  x: i * 85, 
  width: 70, 
  height: 60 + Math.random()*100,
  color: `rgba(${Math.floor(Math.random()*30 + 15)}, ${Math.floor(Math.random()*40 + 20)}, ${Math.floor(Math.random()*70 + 40)}, 0.85)`
}));

// বর ক্যারেক্টার
let bor = { 
  x: 60, y: groundY - 80, width: 65, height: 80, 
  autoForwardSpeed: 0.45, 
  vy: 0, gravity: 0.65, 
  jumpCount: 0, maxJumps: 2, isDead: false 
};

let bou = { 
  x: 650, y: groundY - 80, width: 65, height: 80, 
  baseX: 650,
  speed: 1.5, vy: 0, gravity: 0.65, isJumping: false 
};

// অত্যন্ত স্পষ্ট ও আকর্ষণীয় বাধার তালিকা
const obstacleTypes = [
  { type: 'cactus', width: 55, height: 75, img: imgCactus },
  { type: 'rock', width: 65, height: 50, img: imgRock },
  { type: 'pit', width: 75, height: 25, img: null }
];

let obstacle = { x: 900, y: groundY - 75, width: 55, height: 75, typeData: obstacleTypes[0] };

function setDifficulty(level, e) {
  currentDifficulty = level;
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
  if(e && e.target) e.target.classList.add('active');

  if (level === 'easy') {
    baseSpeed = 4.5;
    bou.baseX = 580;
    bor.autoForwardSpeed = 0.45;
  } else if (level === 'medium') {
    baseSpeed = 6;
    bou.baseX = 660;
    bor.autoForwardSpeed = 0.35;
  } else if (level === 'hard') {
    baseSpeed = 8;
    bou.baseX = 740;
    bor.autoForwardSpeed = 0.25;
  }
  restartGame();
}

function handleTapAction() {
  if (isGameOver || isGameWon) {
    restartGame();
  } else if (bor.jumpCount < bor.maxJumps && !bor.isDead) {
    bor.vy = -13.5;
    bor.jumpCount++;
  }
}

window.addEventListener("touchstart", (e) => {
  if (e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    handleTapAction();
  }
}, { passive: false });

window.addEventListener("mousedown", (e) => {
  if (e.target.tagName !== 'BUTTON') {
    handleTapAction();
  }
});

window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") {
    handleTapAction();
  }
});

function update() {
  stars.forEach(s => { s.x -= s.speed; if(s.x < 0) s.x = canvas.width; });
  cityBuildings.forEach(b => { b.x -= gameSpeed * 0.25; if(b.x + b.width < 0) b.x = canvas.width + 10; });

  if (!bor.isDead && !isGameWon) {
    score++;
    if (score > highScore) highScore = score;
    gameSpeed = baseSpeed + Math.floor(score / 400) * 0.4;

    if (bor.x < bou.x - 30) {
      bor.x += bor.autoForwardSpeed;
    }

    let targetBouX = bou.baseX + Math.sin(score * 0.04) * 40; 
    bou.x = Math.min(canvas.width - bou.width - 20, Math.max(300, targetBouX));

    if (bor.x + bor.width >= bou.x + 10) {
      isGameWon = true;
      playSound(soundWin);
    }

    bor.y += bor.vy; bor.vy += bor.gravity;
    if (bor.y >= groundY - bor.height) {
      bor.y = groundY - bor.height;
      bor.jumpCount = 0;
    }

    obstacle.x -= gameSpeed;
    if (obstacle.x + obstacle.width < 0) {
      const randomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
      obstacle.typeData = randomType;
      obstacle.width = randomType.width;
      obstacle.height = randomType.height;
      obstacle.x = canvas.width + Math.random() * 250;
      obstacle.y = (randomType.type === 'pit') ? groundY : groundY - randomType.height;
    }

    if (obstacle.x - (bou.x + bou.width) < 70 && obstacle.x > bou.x && !bou.isJumping) {
      bou.vy = -13; bou.isJumping = true;
    }

    let isHit = false;
    if (obstacle.typeData.type === 'pit') {
      if (bor.x + bor.width > obstacle.x && bor.x < obstacle.x + obstacle.width && bor.y + bor.height >= groundY) isHit = true;
    } else {
      if (bor.x < obstacle.x + obstacle.width - 5 && bor.x + bor.width - 5 > obstacle.x && bor.y < obstacle.y + obstacle.height && bor.y + bor.height > obstacle.y) isHit = true;
    }

    if (isHit) {
      bor.isDead = true;
      isGameOver = true;
      playSound(soundLose);
    }
  } else if (bor.isDead) {
    if (bou.x < canvas.width + 100) bou.x += 6;
  }

  bou.y += bou.vy; bou.vy += bou.gravity;
  if (bou.y >= groundY - bou.height) { bou.y = groundY - bou.height; bou.isJumping = false; }
}

// বাধা অঙ্কনের বিশেষ এইচডি কাস্টম ফাংশন
function drawEnhancedObstacle(obs) {
  ctx.save();
  
  if (obs.typeData.type === 'pit') {
    // গর্ত/Pit - রেড নিওন ডেঞ্জার গ্লো
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff1744";
    ctx.fillStyle = "#030712";
    ctx.fillRect(obs.x, obs.y, obs.width, 35);
    
    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 4;
    ctx.strokeRect(obs.x, obs.y, obs.width, 35);
    
    // গর্তের ভেতর ওয়ার্নিং স্ট্রাইপ
    ctx.fillStyle = "#ff1744";
    for (let i = 0; i < obs.width; i += 15) {
      ctx.fillRect(obs.x + i, obs.y, 6, 8);
    }
  } 
  else if (obs.typeData.img && obs.typeData.img.complete && obs.typeData.img.naturalWidth !== 0) {
    // ছবি থাকলে ছবি দিয়ে আউটার গ্লো দেওয়া
    ctx.shadowBlur = 15;
    ctx.shadowColor = obs.typeData.type === 'cactus' ? "#00ff66" : "#00d2ff";
    ctx.drawImage(obs.typeData.img, obs.x, obs.y, obs.width, obs.height);
  } 
  else {
    // ছবি লোড না হলে সুন্দর এইচডি গ্রাফিক্স দিয়ে আঁকা
    if (obs.typeData.type === 'cactus') {
      // ক্যাকটাস
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#10b981";
      ctx.fillStyle = "#10b981";
      ctx.beginPath();
      ctx.roundRect(obs.x + 18, obs.y, 18, obs.height, 8);
      ctx.roundRect(obs.x, obs.y + 20, 20, 15, 5);
      ctx.roundRect(obs.x + 35, obs.y + 30, 20, 15, 5);
      ctx.fill();
      ctx.strokeStyle = "#a7f3d0";
      ctx.lineWidth = 3;
      ctx.stroke();
    } else {
      // পাথর (Rock)
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#38bdf8";
      ctx.fillStyle = "#334155";
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y + obs.height);
      ctx.lineTo(obs.x + 12, obs.y + 10);
      ctx.lineTo(obs.x + 35, obs.y);
      ctx.lineTo(obs.x + obs.width, obs.y + 18);
      ctx.lineTo(obs.x + obs.width - 5, obs.y + obs.height);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }
  
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGradient.addColorStop(0, "#050714");
  bgGradient.addColorStop(0.7, "#0d182e");
  bgGradient.addColorStop(1, "#1e293b");
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => {
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()*0.5 + 0.5})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  cityBuildings.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, groundY - b.height, b.width, b.height);
    ctx.fillStyle = "rgba(253, 224, 71, 0.35)";
    for(let wy = groundY - b.height + 10; wy < groundY - 10; wy += 22) {
      ctx.fillRect(b.x + 10, wy, 10, 12);
      ctx.fillRect(b.x + b.width - 20, wy, 10, 12);
    }
  });

  // রাস্তা/মাটি
  ctx.shadowBlur = 18; ctx.shadowColor = "#38bdf8";
  ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
  ctx.shadowBlur = 0;

  // পরিষ্কার ও হাইলাইট করা বাধা আঁকা
  if (!isGameWon) {
    drawEnhancedObstacle(obstacle);
  }

  // বউ
  if (imgBou.complete && imgBou.naturalWidth !== 0) {
    ctx.drawImage(imgBou, bou.x, bou.y, bou.width, bou.height);
  } else {
    ctx.fillStyle = "#f43f5e"; ctx.fillRect(bou.x, bou.y, bou.width, bou.height);
  }

  // বর
  if (!bor.isDead) {
    if (imgBor.complete && imgBor.naturalWidth !== 0) {
      ctx.drawImage(imgBor, bor.x, bor.y, bor.width, bor.height);
    } else {
      ctx.fillStyle = "#0284c7"; ctx.fillRect(bor.x, bor.y, bor.width, bor.height);
    }
  }

  // HUD ড্যাশবোর্ড
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(15, 12, 280, 80, 12);
  ctx.fill(); ctx.stroke();

  ctx.font = "bold 14px Orbitron"; ctx.fillStyle = "#38bdf8";
  ctx.fillText(`MODE: ${currentDifficulty.toUpperCase()}`, 25, 35);
  let dist = Math.max(0, Math.floor((bou.x - bor.x) / 10));
  ctx.font = "bold 16px 'Hind Siliguri'";
  ctx.fillStyle = "#f43f5e"; ctx.fillText(`বউয়ের দূরত্ব: ${dist}m 🏃‍♀️`, 25, 58);
  ctx.fillStyle = "#fbbf24"; ctx.fillText(`সর্বোচ্চ স্কোর: ${highScore}`, 25, 80);

  // GAME OVER স্ক্রিন
  if (bor.isDead) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.94)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (imgGameOver.complete && imgGameOver.naturalWidth !== 0) ctx.drawImage(imgGameOver, canvas.width/2 - 55, 30, 110, 110);
    ctx.textAlign = "center"; ctx.fillStyle = "#ef4444"; ctx.font = "900 38px Orbitron";
    ctx.fillText("GAME OVER", canvas.width / 2, 175);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText("ধুর! SAYIM আটকে গেল! 💔", canvas.width / 2, 220);
    ctx.fillStyle = "#9ca3af"; ctx.font = "bold 16px 'Hind Siliguri'";
    ctx.fillText("আবার খেলতে স্ক্রিনে টাচ করুন 🔄", canvas.width / 2, 265);
    ctx.textAlign = "left";
  }

  // VICTORY SCREEN
  if (isGameWon) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.94)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (imgWin.complete && imgWin.naturalWidth !== 0) ctx.drawImage(imgWin, canvas.width/2 - 60, 25, 120, 120);
    ctx.textAlign = "center"; ctx.fillStyle = "#4ade80"; ctx.font = "900 40px Orbitron";
    ctx.fillText("VICTORY!! 💍🎉", canvas.width / 2, 175);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText(`অভিনন্দন! আপনি ${currentDifficulty.toUpperCase()} TASFIA কে ধরে ফেলেছেন! ❤️`, canvas.width / 2, 220);
    ctx.fillStyle = "#9ca3af"; ctx.font = "bold 16px 'Hind Siliguri'";
    ctx.fillText("আবার খেলতে স্ক্রিনে টাচ করুন 🔄", canvas.width / 2, 265);
    ctx.textAlign = "left";
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function restartGame() {
  soundWin.pause(); soundWin.currentTime = 0;
  soundLose.pause(); soundLose.currentTime = 0;
  isGameOver = false; isGameWon = false; bor.isDead = false;
  score = 0; gameSpeed = baseSpeed;
  bor.x = 60; bor.y = groundY - bor.height; bor.jumpCount = 0;
  
  if (currentDifficulty === 'easy') bou.baseX = 580;
  else if (currentDifficulty === 'medium') bou.baseX = 660;
  else if (currentDifficulty === 'hard') bou.baseX = 740;
  
  bou.x = bou.baseX;
  obstacle.x = 900;
}

gameLoop();
</script>
</body>
</html>
