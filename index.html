<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Catch Your Girl</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Hind+Siliguri:wght@500;700&display=swap');
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #090d16;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Hind Siliguri', sans-serif;
      touch-action: manipulation;
    }
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      padding: 10px;
      border-radius: 20px;
      border: 2px solid rgba(56, 189, 248, 0.3);
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      box-shadow: none;
      justify-content: space-between;
    }
    canvas {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
      background: #070a12;
      width: 100%;
      height: 100%;
      max-height: 64vh;
      object-fit: contain;
      border-radius: 14px;
      touch-action: none;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      padding: 0 4px;
    }
    .diff-selector { display: flex; gap: 10px; }
    .diff-btn {
      padding: 12px 22px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: #0f172a;
      color: #9ca3af;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .diff-btn.active {
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #030712;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.6);
      border-color: #7dd3fc;
    }
    .audio-btn {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 4px;
      margin-bottom: env(safe-area-inset-bottom, 15px);
      width: 100%;
      justify-content: center;
    }
    .btn {
      flex: 1;
      max-width: none;
      height: 85px;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border: none;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      touch-action: manipulation;
      box-shadow: 0 7px 0 #075985, 0 12px 22px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-jump {
      flex: 1.3;
      max-width: none;
      background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%);
      box-shadow: 0 7px 0 #9f1239, 0 12px 22px rgba(244, 63, 94, 0.3);
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 transparent; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <div class="diff-selector">
      <button class="diff-btn active" onclick="setDifficulty('easy', event)">EASY</button>
      <button class="diff-btn" onclick="setDifficulty('medium', event)">MEDIUM</button>
      <button class="diff-btn" onclick="setDifficulty('hard', event)">HARD</button>
    </div>
    <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🔊 Sound: ON</button>
  </div>

  <canvas id="gameCanvas" width="850" height="420"></canvas>

  <div class="controls">
    <button class="btn" id="btnLeft">◀ BACK</button>
    <button class="btn btn-jump" id="btnJump">🦘 JUMP</button>
    <button class="btn" id="btnRight">FORWARD ▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const imgBou = new Image(); imgBou.src = 'bou.jpg'; 
const imgBor = new Image(); imgBor.src = 'bor.jpg'; 
const imgGameOver = new Image(); imgGameOver.src = 'gameover.jpg'; 
const imgWin = new Image(); imgWin.src = 'win.jpg'; 

const imgCactus = new Image(); imgCactus.src = 'https://cdn-icons-png.flaticon.com/512/3532/3532731.png';
const imgRock = new Image(); imgRock.src = 'https://cdn-icons-png.flaticon.com/512/2909/2909772.png';

const soundWin = new Audio('win.mp3');
const soundLose = new Audio('lose.mp3');
let isMuted = false;

function toggleAudio() {
  isMuted = !isMuted;
  document.getElementById('audioToggle').innerText = isMuted ? "🔇 Sound: OFF" : "🔊 Sound: ON";
}

function playSound(sound) {
  if (!isMuted) {
    sound.currentTime = 0;
    sound.play().catch(() => {});
  }
}

let groundY = 315;
let isGameOver = false, isGameWon = false;
let score = 0, highScore = 0;
let baseSpeed = 5, gameSpeed = 5;
let currentDifficulty = 'easy';

// ব্যাকগ্রাউন্ডের তারা ও নিওন বিল্ডিং
let stars = Array.from({length: 45}, () => ({x: Math.random()*850, y: Math.random()*190, speed: Math.random()*0.4 + 0.1, size: Math.random()*2 + 1}));
let cityBuildings = Array.from({length: 12}, (_, i) => ({
  x: i * 80, 
  width: 65, 
  height: 65 + Math.random()*105,
  color: `rgba(${Math.floor(Math.random()*30 + 15)}, ${Math.floor(Math.random()*40 + 20)}, ${Math.floor(Math.random()*60 + 40)}, 0.8)`
}));

// বর ও বউ অবজেক্ট (আরও অনেক বড় সাইজ)
let bor = { 
  x: 80, y: groundY - 110, width: 95, height: 110, 
  speed: 8.5, vy: 0, gravity: 0.65, 
  jumpCount: 0, maxJumps: 2, isDead: false 
};

let bou = { 
  x: 600, y: groundY - 110, width: 95, height: 110, 
  baseX: 600,
  speed: 1.5, vy: 0, gravity: 0.65, isJumping: false 
};

const obstacleTypes = [
  { type: 'cactus', width: 80, height: 95, img: imgCactus, color: '#22c55e' },
  { type: 'rock', width: 85, height: 68, img: imgRock, color: '#64748b' },
  { type: 'pit', width: 90, height: 20, img: null, color: '#0f172a' }
];

let obstacle = { x: 850, y: groundY - 95, width: 80, height: 95, typeData: obstacleTypes[0] };
let moveLeft = false, moveRight = false;

function setDifficulty(level, e) {
  currentDifficulty = level;
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
  if(e && e.target) e.target.classList.add('active');

  if (level === 'easy') {
    baseSpeed = 5;
    bou.baseX = 520; 
  } else if (level === 'medium') {
    baseSpeed = 7;
    bou.baseX = 610; 
  } else if (level === 'hard') {
    baseSpeed = 9;
    bou.baseX = 690; 
  }
  restartGame();
}

function makeBorJump() {
  if (bor.jumpCount < bor.maxJumps && !bor.isDead && !isGameWon) {
    bor.vy = -14;
    bor.jumpCount++;
  }
}

// মোবাইল টাচ ইভেন্ট লজিক
const bindTouch = (elem, startFn, endFn) => {
  elem.addEventListener("touchstart", (e) => { e.preventDefault(); startFn(); }, { passive: false });
  elem.addEventListener("touchend", (e) => { e.preventDefault(); if(endFn) endFn(); }, { passive: false });
  elem.addEventListener("mousedown", startFn);
  elem.addEventListener("mouseup", endFn);
};

bindTouch(document.getElementById("btnLeft"), () => moveLeft = true, () => moveLeft = false);
bindTouch(document.getElementById("btnRight"), () => moveRight = true, () => moveRight = false);
bindTouch(document.getElementById("btnJump"), () => makeBorJump());

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a") moveLeft = true;
  if (e.key === "ArrowRight" || e.key === "d") moveRight = true;
  if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") {
    if (isGameOver || isGameWon) restartGame();
    else makeBorJump();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a") moveLeft = false;
  if (e.key === "ArrowRight" || e.key === "d") moveRight = false;
});

function update() {
  stars.forEach(s => { s.x -= s.speed; if(s.x < 0) s.x = canvas.width; });
  cityBuildings.forEach(b => { b.x -= gameSpeed * 0.25; if(b.x + b.width < 0) b.x = canvas.width + 10; });

  if (!bor.isDead && !isGameWon) {
    score++;
    if (score > highScore) highScore = score;
    gameSpeed = baseSpeed + Math.floor(score / 350) * 0.5;

    // বরের মুভমেন্ট
    if (moveLeft && bor.x > 0) bor.x -= bor.speed;
    if (moveRight) bor.x += bor.speed;

    // বউ স্ক্রিন থেকে বের হবে না! নির্দিষ্ট সীমায় আটকে থাকবে
    let targetBouX = bou.baseX + Math.sin(score * 0.05) * 40; 
    bou.x = Math.min(canvas.width - bou.width - 15, Math.max(300, targetBouX));

    // বর বউকে ধরে ফেললে (WIN CONDITION)
    if (bor.x + bor.width >= bou.x + 15) {
      isGameWon = true;
      playSound(soundWin);
    }

    // বরের ফিজিক্স
    bor.y += bor.vy; bor.vy += bor.gravity;
    if (bor.y >= groundY - bor.height) {
      bor.y = groundY - bor.height;
      bor.jumpCount = 0;
    }

    // বাধা (Obstacle) মুভমেন্ট
    obstacle.x -= gameSpeed;
    if (obstacle.x + obstacle.width < 0) {
      const randomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
      obstacle.typeData = randomType;
      obstacle.width = randomType.width;
      obstacle.height = randomType.height;
      obstacle.x = canvas.width + Math.random() * 250;
      obstacle.y = (randomType.type === 'pit') ? groundY : groundY - randomType.height;
    }

    // বউয়ের অটোজাম্প AI
    if (obstacle.x - (bou.x + bou.width) < 90 && obstacle.x > bou.x && !bou.isJumping) {
      bou.vy = -14.5; bou.isJumping = true;
    }

    // বর বাধার সাথে ধাক্কা খেলে (GAME OVER)
    let isHit = false;
    if (obstacle.typeData.type === 'pit') {
      if (bor.x + bor.width - 15 > obstacle.x && bor.x + 15 < obstacle.x + obstacle.width && bor.y + bor.height >= groundY) isHit = true;
    } else {
      if (bor.x + 12 < obstacle.x + obstacle.width - 12 && bor.x + bor.width - 12 > obstacle.x + 12 && bor.y + 12 < obstacle.y + obstacle.height && bor.y + bor.height > obstacle.y + 12) isHit = true;
    }

    if (isHit) {
      bor.isDead = true;
      isGameOver = true;
      playSound(soundLose);
    }
  } else if (bor.isDead) {
    if (bou.x < canvas.width + 100) bou.x += 6; 
  }

  // বউয়ের ফিজিক্স
  bou.y += bou.vy; bou.vy += bou.gravity;
  if (bou.y >= groundY - bou.height) { bou.y = groundY - bou.height; bou.isJumping = false; }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ব্যাকগ্রাউন্ড গ্র্যাডিয়েন্ট
  let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGradient.addColorStop(0, "#070a14");
  bgGradient.addColorStop(0.7, "#0d1527");
  bgGradient.addColorStop(1, "#172554");
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // তারা
  stars.forEach(s => {
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()*0.5 + 0.5})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  // নিওন বিল্ডিং
  cityBuildings.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, groundY - b.height, b.width, b.height);
    ctx.fillStyle = "rgba(253, 224, 71, 0.3)";
    for(let wy = groundY - b.height + 12; wy < groundY - 12; wy += 22) {
      ctx.fillRect(b.x + 12, wy, 10, 12);
      ctx.fillRect(b.x + b.width - 22, wy, 10, 12);
    }
  });

  // মাটি (Ground Line)
  ctx.shadowBlur = 15; ctx.shadowColor = "#38bdf8";
  ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
  ctx.shadowBlur = 0;

  // বাধা (Obstacle)
  if (!isGameWon) {
    if (obstacle.typeData.type === 'pit') {
      ctx.fillStyle = "#030712"; ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, 35);
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2; ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, 35);
    } else if (obstacle.typeData.img && obstacle.typeData.img.complete && obstacle.typeData.img.naturalWidth !== 0) {
      ctx.drawImage(obstacle.typeData.img, obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    } else {
      ctx.fillStyle = obstacle.typeData.color; ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    }
  }

  // বউ
  if (imgBou.complete && imgBou.naturalWidth !== 0) {
    ctx.drawImage(imgBou, bou.x, bou.y, bou.width, bou.height);
  } else {
    ctx.fillStyle = "#f43f5e"; ctx.fillRect(bou.x, bou.y, bou.width, bou.height);
  }

  // বর
  if (!bor.isDead) {
    if (imgBor.complete && imgBor.naturalWidth !== 0) {
      ctx.drawImage(imgBor, bor.x, bor.y, bor.width, bor.height);
    } else {
      ctx.fillStyle = "#0284c7"; ctx.fillRect(bor.x, bor.y, bor.width, bor.height);
    }
  }

  // HUD ড্যাশবোর্ড (আরও বড় সাইজ)
  ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
  ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(15, 12, 300, 88, 14);
  ctx.fill(); ctx.stroke();

  ctx.font = "bold 16px Orbitron"; ctx.fillStyle = "#38bdf8";
  ctx.fillText(`MODE: ${currentDifficulty.toUpperCase()}`, 28, 38);
  let dist = Math.max(0, Math.floor((bou.x - bor.x) / 10));
  ctx.fillStyle = "#f43f5e"; ctx.fillText(`BOU DISTANCE: ${dist}m 🏃‍♀️`, 28, 62);
  ctx.fillStyle = "#fbbf24"; ctx.fillText(`HIGH SCORE: ${highScore}`, 28, 86);

  // GAME OVER স্ক্রিন
  if (bor.isDead) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.94)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (imgGameOver.complete && imgGameOver.naturalWidth !== 0) ctx.drawImage(imgGameOver, canvas.width/2 - 65, 25, 130, 130);
    ctx.textAlign = "center"; ctx.fillStyle = "#ef4444"; ctx.font = "900 42px Orbitron";
    ctx.fillText("GAME OVER", canvas.width / 2, 180);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText("ধুর! SAYIM আটকে গেল! 💔", canvas.width / 2, 225);
    ctx.fillStyle = "#9ca3af"; ctx.font = "18px 'Hind Siliguri'";
    ctx.fillText("TAP SCREEN TO TRY AGAIN 🔄", canvas.width / 2, 275);
    ctx.textAlign = "left";
  }

  // VICTORY SCREEN
  if (isGameWon) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.94)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (imgWin.complete && imgWin.naturalWidth !== 0) ctx.drawImage(imgWin, canvas.width/2 - 70, 25, 140, 140);
    ctx.textAlign = "center"; ctx.fillStyle = "#4ade80"; ctx.font = "900 44px Orbitron";
    ctx.fillText("VICTORY!! 💍🎉", canvas.width / 2, 185);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText(`অভিনন্দন! আপনি ${currentDifficulty.toUpperCase()} TASFIA কে ধরে ফেলেছেন! ❤️`, canvas.width / 2, 230);
    ctx.fillStyle = "#9ca3af"; ctx.font = "18px 'Hind Siliguri'";
    ctx.fillText("TAP SCREEN TO TRY AGAIN 🔄", canvas.width / 2, 280);
    ctx.textAlign = "left";
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function restartGame() {
  soundWin.pause(); soundWin.currentTime = 0;
  soundLose.pause(); soundLose.currentTime = 0;
  isGameOver = false; isGameWon = false; bor.isDead = false;
  score = 0; gameSpeed = baseSpeed;
  bor.x = 80; bor.y = groundY - bor.height; bor.jumpCount = 0;
  
  if (currentDifficulty === 'easy') bou.baseX = 520;
  else if (currentDifficulty === 'medium') bou.baseX = 610;
  else if (currentDifficulty === 'hard') bou.baseX = 690;
  
  bou.x = bou.baseX;
  obstacle.x = 850;
}

canvas.addEventListener("touchstart", (e) => { 
  e.preventDefault(); 
  if (isGameOver || isGameWon) restartGame(); 
}, { passive: false });

canvas.addEventListener("click", () => { 
  if (isGameOver || isGameWon) restartGame(); 
});

gameLoop();
</script>
</body>
</html>
