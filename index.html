<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Catch Your Girl - Ultra Mobile HD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Hind+Siliguri:wght@700;800&display=swap');
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: #020617;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Hind Siliguri', sans-serif;
      touch-action: manipulation;
    }

    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      padding: 8px;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
    }

    .top-bar {
      position: absolute;
      top: 10px;
      right: 15px;
      z-index: 10;
    }

    .audio-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #38bdf8;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    canvas {
      border: 2px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      background: #050811;
      width: 100%;
      height: 100%;
      max-width: 950px;
      max-height: 500px;
      border-radius: 12px;
      touch-action: none;
      object-fit: contain;
    }

    .tap-hint {
      position: absolute;
      bottom: 15px;
      color: #7dd3fc;
      font-size: 15px;
      font-weight: 800;
      pointer-events: none;
      animation: pulse 1.2s infinite;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      z-index: 5;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🔊 Sound: ON</button>
  </div>

  <canvas id="gameCanvas" width="900" height="420"></canvas>
  <div class="tap-hint">👆 স্ক্রিনে টাচ করে লাফ দিন!</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// মোবাইলে ক্রিস্প ও শার্প দেখার জন্য HD Scaling
function setupCanvasScaling() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 900 * dpr;
  canvas.height = 420 * dpr;
  ctx.scale(dpr, dpr);
}
setupCanvasScaling();

const imgBou = new Image(); imgBou.src = 'bou.jpg'; 
const imgBor = new Image(); imgBor.src = 'bor.jpg'; 
const imgGameOver = new Image(); imgGameOver.src = 'gameover.jpg'; 
const imgWin = new Image(); imgWin.src = 'win.jpg'; 

const soundWin = new Audio('win.mp3');
const soundLose = new Audio('lose.mp3');
let isMuted = false;

function toggleAudio() {
  isMuted = !isMuted;
  document.getElementById('audioToggle').innerText = isMuted ? "🔇 Sound: OFF" : "🔊 Sound: ON";
}

function playSound(sound) {
  if (!isMuted) {
    sound.currentTime = 0;
    sound.play().catch(() => {});
  }
}

let groundY = 340;
let isGameOver = false, isGameWon = false;
let score = 0, highScore = 0;
let baseSpeed = 4.5, gameSpeed = 4.5;

// স্টার ও সিটি ব্যাকগ্রাউন্ড
let stars = Array.from({length: 40}, () => ({x: Math.random()*900, y: Math.random()*190, speed: Math.random()*0.5 + 0.1, size: Math.random()*2 + 1}));
let cityBuildings = Array.from({length: 10}, (_, i) => ({
  x: i * 100, 
  width: 80, 
  height: 70 + Math.random()*90,
  color: `rgba(${Math.floor(Math.random()*30 + 15)}, ${Math.floor(Math.random()*40 + 20)}, ${Math.floor(Math.random()*70 + 40)}, 0.85)`
}));

// বর ও বউ (সাইজ বড় করা হয়েছে যাতে মোবাইলে স্পষ্ট দেখায়)
let bor = { 
  x: 80, y: groundY - 85, width: 70, height: 85, 
  autoForwardSpeed: 0.5, 
  vy: 0, gravity: 0.65, 
  jumpCount: 0, maxJumps: 2, isDead: false 
};

let bou = { 
  x: 550, y: groundY - 85, width: 70, height: 85, 
  baseX: 550,
  speed: 1.2, vy: 0, gravity: 0.65, isJumping: false 
};

// অত্যন্ত স্পষ্ট ৩টি বড় নিওন বাধা
const obstacleTypes = [
  { type: 'laser', width: 45, height: 80 },
  { type: 'spike', width: 65, height: 60 },
  { type: 'portal', width: 80, height: 32 }
];

let obstacle = { x: 900, y: groundY - 80, width: 45, height: 80, typeData: obstacleTypes[0] };

function handleTapAction() {
  if (isGameOver || isGameWon) {
    restartGame();
  } else if (bor.jumpCount < bor.maxJumps && !bor.isDead) {
    bor.vy = -13.8;
    bor.jumpCount++;
  }
}

window.addEventListener("touchstart", (e) => {
  if (e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    handleTapAction();
  }
}, { passive: false });

window.addEventListener("mousedown", (e) => {
  if (e.target.tagName !== 'BUTTON') {
    handleTapAction();
  }
});

window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") {
    handleTapAction();
  }
});

function update() {
  stars.forEach(s => { s.x -= s.speed; if(s.x < 0) s.x = 900; });
  cityBuildings.forEach(b => { b.x -= gameSpeed * 0.25; if(b.x + b.width < 0) b.x = 900 + 10; });

  if (!bor.isDead && !isGameWon) {
    score++;
    if (score > highScore) highScore = score;
    gameSpeed = baseSpeed + Math.floor(score / 450) * 0.3;

    if (bor.x < bou.x - 30) {
      bor.x += bor.autoForwardSpeed;
    }

    let targetBouX = bou.baseX + Math.sin(score * 0.04) * 35; 
    bou.x = Math.min(900 - bou.width - 20, Math.max(280, targetBouX));

    if (bor.x + bor.width >= bou.x + 10) {
      isGameWon = true;
      playSound(soundWin);
    }

    bor.y += bor.vy; bor.vy += bor.gravity;
    if (bor.y >= groundY - bor.height) {
      bor.y = groundY - bor.height;
      bor.jumpCount = 0;
    }

    obstacle.x -= gameSpeed;
    if (obstacle.x + obstacle.width < 0) {
      const randomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
      obstacle.typeData = randomType;
      obstacle.width = randomType.width;
      obstacle.height = randomType.height;
      obstacle.x = 900 + Math.random() * 250;
      obstacle.y = (randomType.type === 'portal') ? groundY - 5 : groundY - randomType.height;
    }

    if (obstacle.x - (bou.x + bou.width) < 70 && obstacle.x > bou.x && !bou.isJumping) {
      bou.vy = -13; bou.isJumping = true;
    }

    let isHit = false;
    if (obstacle.typeData.type === 'portal') {
      if (bor.x + bor.width > obstacle.x && bor.x < obstacle.x + obstacle.width && bor.y + bor.height >= groundY - 5) isHit = true;
    } else {
      if (bor.x < obstacle.x + obstacle.width - 5 && bor.x + bor.width - 5 > obstacle.x && bor.y < obstacle.y + obstacle.height && bor.y + bor.height > obstacle.y) isHit = true;
    }

    if (isHit) {
      bor.isDead = true;
      isGameOver = true;
      playSound(soundLose);
    }
  } else if (bor.isDead) {
    if (bou.x < 900 + 100) bou.x += 6;
  }

  bou.y += bou.vy; bou.vy += bou.gravity;
  if (bou.y >= groundY - bou.height) { bou.y = groundY - bou.height; bou.isJumping = false; }
}

// মোবাইলের জন্য স্পষ্ট ও উজ্জ্বল বাধা
function drawMobileHDObstacle(obs) {
  ctx.save();
  
  if (obs.typeData.type === 'laser') {
    // হাই-ব্রাইটনেস লেজার বাধা
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff0055";
    
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(obs.x + 12, obs.y, 20, 16);
    ctx.fillRect(obs.x + 12, obs.y + obs.height - 16, 20, 16);
    
    ctx.fillStyle = "#ff0055";
    ctx.fillRect(obs.x + 16, obs.y + 12, 12, obs.height - 24);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(obs.x + 20, obs.y + 12, 4, obs.height - 24);
  } 
  else if (obs.typeData.type === 'spike') {
    // নিওন সায়ান কন্টক বাধা
    ctx.shadowBlur = 22;
    ctx.shadowColor = "#00f0ff";
    ctx.fillStyle = "#00f0ff";
    
    let count = 3;
    let w = obs.width / count;
    for(let i = 0; i < count; i++) {
      ctx.beginPath();
      ctx.moveTo(obs.x + i * w, obs.y + obs.height);
      ctx.lineTo(obs.x + i * w + w / 2, obs.y);
      ctx.lineTo(obs.x + (i + 1) * w, obs.y + obs.height);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  } 
  else if (obs.typeData.type === 'portal') {
    // নিওন গোল্ড এনার্জি ট্র্যাপ
    ctx.shadowBlur = 25;
    ctx.shadowColor = "#facc15";
    
    ctx.fillStyle = "rgba(250, 204, 21, 0.4)";
    ctx.fillRect(obs.x, obs.y, obs.width, 22);
    
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 4;
    ctx.strokeRect(obs.x, obs.y, obs.width, 22);
    
    ctx.fillStyle = "#ffffff";
    let pX = obs.x + (score * 10) % (obs.width - 15);
    ctx.fillRect(pX, obs.y, 15, 22);
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, 900, 420);

  let bgGradient = ctx.createLinearGradient(0, 0, 0, 420);
  bgGradient.addColorStop(0, "#030712");
  bgGradient.addColorStop(0.7, "#0b1329");
  bgGradient.addColorStop(1, "#1e293b");
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, 900, 420);

  stars.forEach(s => {
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  cityBuildings.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, groundY - b.height, b.width, b.height);
    ctx.fillStyle = "rgba(253, 224, 71, 0.4)";
    for(let wy = groundY - b.height + 10; wy < groundY - 10; wy += 22) {
      ctx.fillRect(b.x + 12, wy, 12, 12);
      ctx.fillRect(b.x + b.width - 24, wy, 12, 12);
    }
  });

  // রাস্তা/মাটি (মোটা নিওন ট্র্যাক)
  ctx.shadowBlur = 15; ctx.shadowColor = "#38bdf8";
  ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(900, groundY); ctx.stroke();
  ctx.shadowBlur = 0;

  if (!isGameWon) {
    drawMobileHDObstacle(obstacle);
  }

  // বউ
  if (imgBou.complete && imgBou.naturalWidth !== 0) {
    ctx.drawImage(imgBou, bou.x, bou.y, bou.width, bou.height);
  } else {
    ctx.fillStyle = "#f43f5e"; ctx.fillRect(bou.x, bou.y, bou.width, bou.height);
  }

  // বর
  if (!bor.isDead) {
    if (imgBor.complete && imgBor.naturalWidth !== 0) {
      ctx.drawImage(imgBor, bor.x, bor.y, bor.width, bor.height);
    } else {
      ctx.fillStyle = "#0284c7"; ctx.fillRect(bor.x, bor.y, bor.width, bor.height);
    }
  }

  // HUD ড্যাশবোর্ড (সহজে দৃশ্যমান বড় ফন্ট)
  ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(15, 12, 270, 62, 10);
  ctx.fill(); ctx.stroke();

  let dist = Math.max(0, Math.floor((bou.x - bor.x) / 10));
  ctx.font = "bold 17px 'Hind Siliguri'";
  ctx.fillStyle = "#ff4d6d"; ctx.fillText(`বউয়ের দূরত্ব: ${dist}m 🏃‍♀️`, 25, 36);
  ctx.fillStyle = "#ffb703"; ctx.fillText(`সর্বোচ্চ স্কোর: ${highScore}`, 25, 60);

  // GAME OVER স্ক্রিন
  if (bor.isDead) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.95)";
    ctx.fillRect(0, 0, 900, 420);
    if (imgGameOver.complete && imgGameOver.naturalWidth !== 0) ctx.drawImage(imgGameOver, 900/2 - 55, 30, 110, 110);
    ctx.textAlign = "center"; ctx.fillStyle = "#ef4444"; ctx.font = "900 38px Orbitron";
    ctx.fillText("GAME OVER", 900 / 2, 175);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText("ধুর! SAYIM আটকে গেল! 💔", 900 / 2, 220);
    ctx.fillStyle = "#9ca3af"; ctx.font = "bold 16px 'Hind Siliguri'";
    ctx.fillText("আবার খেলতে স্ক্রিনে টাচ করুন 🔄", 900 / 2, 265);
    ctx.textAlign = "left";
  }

  // VICTORY SCREEN
  if (isGameWon) {
    ctx.fillStyle = "rgba(3, 7, 18, 0.95)";
    ctx.fillRect(0, 0, 900, 420);
    if (imgWin.complete && imgWin.naturalWidth !== 0) ctx.drawImage(imgWin, 900/2 - 60, 25, 120, 120);
    ctx.textAlign = "center"; ctx.fillStyle = "#4ade80"; ctx.font = "900 40px Orbitron";
    ctx.fillText("VICTORY!! 💍🎉", 900 / 2, 175);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 22px 'Hind Siliguri'";
    ctx.fillText("অভিনন্দন! আপনি TASFIA কে ধরে ফেলেছেন! ❤️", 900 / 2, 220);
    ctx.fillStyle = "#9ca3af"; ctx.font = "bold 16px 'Hind Siliguri'";
    ctx.fillText("আবার খেলতে স্ক্রিনে টাচ করুন 🔄", 900 / 2, 265);
    ctx.textAlign = "left";
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function restartGame() {
  soundWin.pause(); soundWin.currentTime = 0;
  soundLose.pause(); soundLose.currentTime = 0;
  isGameOver = false; isGameWon = false; bor.isDead = false;
  score = 0; gameSpeed = baseSpeed;
  bor.x = 80; bor.y = groundY - bor.height; bor.jumpCount = 0;
  bou.x = 550; bou.baseX = 550;
  obstacle.x = 900;
}

gameLoop();
</script>
</body>
</html>
